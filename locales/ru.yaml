start_message: '🛡 <b>EscrowMe</b> 🛡

<i>Ваш гарант-сервис в Telegram</i>


Я защищаю обе стороны. Быстро. Безопасно. Анонимно.


<b>Покупатель</b>: Будьте на 100% защищены от скама и мошенничества

<b>Продавец</b>: Укрепляйте доверие с помощью безопасных сделок через гаранта


Как именно это работает?

◾️ Покупатель или продавец начинает сделку командой <b>/create</b>

◾️ Я создам группу для сделки и выдам вам ссылку

◾️ Покупатель и продавец должны вступить в эту группу

◾️ Каждая сторона должна написать <code>/buyer ваш_кошелек</code> или <code>/seller ваш_кошелек</code> — замените "ваш_кошелек" на адрес вашего кошелька

◾️ Договоритесь о монете. Кошельки должны быть в одной и той же сети

◾️ После того как оба подтвердят роли, я выдам кошелек гаранта — покупатель должен отправить средства туда

◾️ Сделка прошла успешно? Введите <b>/pay_seller</b>, чтобы перевести средства

◾️ Возникла проблема? Введите <b>/dispute</b> — мы решим ее справедливо


<b>Комиссия гаранта:</b>

${fee}% — минимум $${fix}'

